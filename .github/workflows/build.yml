name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run TypeScript and Go checks before packaging
        required: true
        default: true
        type: boolean
      artifact_name:
        description: Artifact base name
        required: false
        default: phantom-lancer-linux-amd64
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    name: Linux amd64 package
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    # 固定 ubuntu-22.04 (glibc 2.35):DuckDB 静态库要求 GLIBC_2.35,
    # 在此基准上构建可让二进制兼容 glibc >= 2.35 的目标系统。
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      publish_release: ${{ steps.version.outputs.publish_release }}
    env:
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GOPROXY: https://proxy.golang.org,direct
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      ARTIFACT_NAME: ${{ inputs.artifact_name || 'phantom-lancer-linux-amd64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          release_tag=""
          build_version=""
          publish_release="false"

          latest_semver_tag() {
            local tag
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                printf '%s\n' "$tag"
                return
              fi
            done < <(git tag --list 'v*' --sort=-v:refname)
          }

          head_semver_tag() {
            local tag
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                printf '%s\n' "$tag"
                return
              fi
            done < <(git tag --points-at HEAD --list 'v*' --sort=-v:refname)
          }

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            release_tag="${{ github.event.release.tag_name }}"
            build_version="$release_tag"
            publish_release="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            build_version="$release_tag"
            publish_release="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            git fetch --force --tags origin

            exact_tag="$(head_semver_tag || true)"
            if [[ -n "$exact_tag" ]]; then
              release_tag="$exact_tag"
            else
              latest_tag="$(latest_semver_tag || true)"
              if [[ -z "$latest_tag" ]]; then
                latest_tag="v0.0.0"
              fi
              if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "latest release tag is not semantic: $latest_tag" >&2
                exit 1
              fi
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            fi

            build_version="$release_tag"
            publish_release="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch --force --tags origin

            exact_tag="$(head_semver_tag || true)"
            if [[ -n "$exact_tag" ]]; then
              release_tag="$exact_tag"
            else
              latest_tag="$(latest_semver_tag || true)"
              if [[ -z "$latest_tag" ]]; then
                latest_tag="v0.0.0"
              fi
              if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "latest release tag is not semantic: $latest_tag" >&2
                exit 1
              fi
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            fi

            build_version="$release_tag"
            publish_release="true"
          fi

          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          if [[ -n "$release_tag" ]]; then
            echo "Resolved release tag: $release_tag"
          else
            echo "No release tag resolved; this run will only upload workflow artifacts."
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify build toolchain
        run: |
          go version
          gcc --version
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Type-check frontend
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        working-directory: web
        run: npm run check

      - name: Build embedded frontend
        working-directory: web
        run: npm run build

      - name: Test Go packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: go test ./...

      - name: Build server binary
        env:
          PL_BIN_DIR: ${{ github.workspace }}/release/bin
          PL_OUT: ${{ github.workspace }}/release/bin/phantom-lancer
          PL_SUPERVISOR_OUT: ${{ github.workspace }}/release/bin/phantom-supervisor
          PL_SKIP_WEB_BUILD: "1"
          PL_VERSION: ${{ steps.version.outputs.build_version }}
        run: scripts/build.sh

      - name: Verify release binaries
        run: |
          set -Eeuo pipefail
          for bin in phantom-lancer phantom-supervisor; do
            file "release/bin/$bin"
            if ! file "release/bin/$bin" | grep -q "ELF 64-bit LSB executable, x86-64"; then
              echo "release/$bin must be a linux/amd64 ELF executable" >&2
              exit 1
            fi
            # glibc 动态链接:确保所有依赖库都能解析(不能有 not found)
            if ldd "release/bin/$bin" | grep -q "not found"; then
              echo "release/$bin has unresolved dynamic dependencies:" >&2
              ldd "release/bin/$bin" >&2
              exit 1
            fi
          done

      - name: Assemble release archive
        id: package
        run: |
          set -Eeuo pipefail

          package_root="release/package/phantom-lancer"
          mkdir -p "$package_root/bin" "$package_root/configs" "$package_root/scripts"

          cp release/bin/phantom-lancer "$package_root/bin/phantom-lancer"
          chmod 0755 "$package_root/bin/phantom-lancer"
          cp release/bin/phantom-supervisor "$package_root/bin/phantom-supervisor"
          chmod 0755 "$package_root/bin/phantom-supervisor"

          cp configs/phantom.example.toml "$package_root/configs/phantom.example.toml"
          cp README.md LICENSE "$package_root/"
          cp scripts/start.sh scripts/manage.sh "$package_root/scripts/"
          chmod 0755 "$package_root/scripts/"*.sh

          tar -czf "release/${ARTIFACT_NAME}.tar.gz" -C release/package phantom-lancer
          (cd release && sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256")
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            release/${{ env.ARTIFACT_NAME }}.tar.gz
            release/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: linux-amd64
    if: ${{ needs.linux-amd64.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARTIFACT_NAME: ${{ needs.linux-amd64.outputs.artifact_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.linux-amd64.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release

      - name: Ensure release tag exists
        run: |
          set -Eeuo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists."
          else
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Create or update release
        run: |
          set -Eeuo pipefail

          archive="release/${ARTIFACT_NAME}.tar.gz"
          checksum="release/${ARTIFACT_NAME}.tar.gz.sha256"
          title="Phantom Lancer ${TAG_NAME}"
          notes="Automated Linux amd64 build for ${TAG_NAME}."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$TAG_NAME" "$archive" "$checksum" \
              --verify-tag \
              --title "$title" \
              --notes "$notes"
          fi
